<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CustPlay</title>
<link rel="stylesheet" href="style.css?v=31">   <!-- ?v=N: подъём при каждой правке стилей — иначе телефон/ПК может держать старый CSS эвристическим кэшем (SW network-first не всегда спасает) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#14141f">
<script>
// PWA: регистрация service worker (работает на https-хостинге и localhost; на file:// не нужна)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</head>
<body>

<header id="topbar"></header>

<nav id="pageTabs" class="page-tabs hidden"></nav>

<main id="canvas" class="canvas"></main>

<button id="fab" class="fab hidden" title="Добавить карточку">+</button>

<div id="backdrop" class="backdrop hidden"></div>
<div id="modal" class="modal hidden" role="dialog"></div>

<!-- Второй слой ярлыка (свернутые И/З/В): без креста — закрытие тапом мимо или Esc -->
<div id="labelLayer" class="label-layer hidden"></div>

<aside id="log" class="log hidden"></aside>

<section id="diceWidget" class="dw hidden"></section>

<div id="toast" class="toast hidden"></div>

<input type="file" id="fileInput" accept=".json,application/json" class="hidden">

<script src="js/i18n.js"></script>
<script src="js/dice.js"></script>
<script src="js/formula.js"></script>
<script src="js/app.js"></script>
</body>
</html>
